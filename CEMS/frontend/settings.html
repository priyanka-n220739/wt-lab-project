<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account Settings - EduEvents</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Inter', sans-serif;
        background: #f7f8fc;
        color: #2d3a4a;
        min-height: 100vh;
        display: flex;
    }

    /* ── DASHBOARD SIDEBAR SHELL ── */
    .sidebar {
        width: 230px;
        background: #fff;
        border-right: 1px solid #e8ecf4;
        display: flex;
        flex-direction: column;
        position: fixed;
        top: 0; left: 0; bottom: 0;
        z-index: 50;
    }
    .sidebar-logo { padding: 22px 20px; border-bottom: 1px solid #e8ecf4; }
    .sidebar-logo h2 { font-size: 1.1rem; font-weight: 700; color: #1a56db; }
    .sidebar-logo.student-mode h2 { color: #10b981; }
    .sidebar-logo p { font-size: 0.7rem; color: #9aa3b2; margin-top: 2px; }
    .sidebar nav { padding: 14px 12px; flex: 1; }
    .nav-section { font-size: 0.65rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #b0b9c8; padding: 10px 10px 4px; }
    .nav-link { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; font-size: 0.86rem; color: #6b7a90; text-decoration: none; margin-bottom: 2px; transition: all 0.15s; font-weight: 500; }
    
    .nav-link:hover { background: #f0f4ff; color: #1a56db; }
    .nav-link.active { background: #eef2ff; color: #1a56db; font-weight: 600; }
    
    .student-mode .nav-link:hover { background: #ecfdf5; color: #10b981; }
    .student-mode .nav-link.active { background: #d1fae5; color: #059669; }
    
    .nav-link .icon { font-size: 1rem; width: 20px; text-align: center; }
    .sidebar-footer { padding: 14px 16px; border-top: 1px solid #e8ecf4; display: flex; align-items: center; gap: 10px; }
    .user-avatar { width: 34px; height: 34px; border-radius: 50%; background: #1a56db; color: white; display: flex; align-items: center; justify-content: center; font-size: 0.78rem; font-weight: 700; }
    .student-mode .user-avatar { background: #10b981; }
    .user-name { font-size: 0.82rem; font-weight: 600; }
    .user-role { font-size: 0.7rem; color: #9aa3b2; }

    /* ── MAIN AREA ── */
    .main {
        margin-left: 230px;
        flex: 1;
        display: flex;
        flex-direction: column;
    }
    .topbar {
        background: #fff;
        border-bottom: 1px solid #e8ecf4;
        padding: 14px 28px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        position: sticky; top: 0; z-index: 20;
    }
    .topbar-left h1 { font-size: 1.1rem; font-weight: 700; }
    .topbar-left p  { font-size: 0.75rem; color: #9aa3b2; margin-top: 1px; }

    .content {
        padding: 30px 40px;
        max-width: 900px;
        width: 100%;
    }

    /* ── SETTINGS CARD ── */
    .card {
        background: #fff;
        border: 1px solid #e8ecf4;
        border-radius: 12px;
        padding: 24px 30px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.02);
    }
    .page-header { margin-bottom: 25px; }
    .page-header h2 { font-size: 1.5rem; font-weight: 700; color: #111827; }
    .page-header p { font-size: 0.85rem; color: #6b7280; margin-top: 5px; }

    .profile-header {
        display: flex; align-items: center; gap: 20px;
        margin-bottom: 25px; padding-bottom: 25px;
        border-bottom: 1px solid #f3f4f6;
    }
    .profile-avatar-large {
        width: 90px; height: 90px;
        border-radius: 50%; object-fit: cover;
        border: 3px solid #f3f4f6;
    }
    .avatar-actions { display: flex; gap: 10px; margin-top: 10px; }
    
    .btn-sm { padding: 6px 14px; border-radius: 6px; font-size: 0.8rem; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; border: none; transition: 0.2s; }
    .btn-outline { background: #fff; border: 1px solid #d1d5db; color: #374151; }
    .btn-outline:hover { background: #f9fafb; border-color: #9ca3af; }
    .btn-danger { color: #ef4444; background: #fef2f2; }
    .btn-danger:hover { background: #fee2e2; }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
    .form-group.full-width { grid-column: span 2; }
    .form-group label { display: block; font-size: 0.8rem; font-weight: 600; color: #374151; margin-bottom: 6px; }
    .form-control {
        width: 100%; padding: 9px 12px;
        border: 1px solid #d1d5db; border-radius: 8px;
        font-family: inherit; font-size: 0.9rem; color: #111827;
        transition: border-color 0.2s; outline: none;
    }
    .form-control:focus { border-color: #1a56db; box-shadow: 0 0 0 3px rgba(26,86,219,0.1); }
    .student-mode .form-control:focus { border-color: #10b981; box-shadow: 0 0 0 3px rgba(16,185,129,0.1); }

    .form-actions {
        display: flex; justify-content: flex-end; gap: 12px;
        margin-top: 25px; padding-top: 20px;
        border-top: 1px solid #f3f4f6;
    }
    .btn-primary {
        background: #1a56db; color: white;
        padding: 9px 20px; border-radius: 8px;
        font-weight: 600; font-size: 0.9rem; border: none; cursor: pointer; transition: 0.2s;
    }
    .btn-primary:hover { background: #1e40af; }
    .student-mode .btn-primary { background: #10b981; }
    .student-mode .btn-primary:hover { background: #059669; }

    @media (max-width: 768px) {
        .sidebar { display: none; }
        .main { margin-left: 0; }
        .form-grid { grid-template-columns: 1fr; }
        .form-group.full-width { grid-column: span 1; }
    }
</style>
</head>
<body>

<!-- DYNAMIC SIDEBAR -->
<div id="sidebarContainer"></div>

<!-- MAIN -->
<div class="main">
    <div class="topbar">
        <div class="topbar-left">
            <h1 id="roleTitle">Account Settings</h1>
            <p>Manage your professional profile and application preferences</p>
        </div>
    </div>

    <div class="content" id="mainContentWrapper">
        <div class="card">
            <div class="page-header">
                <h2>Profile Overview</h2>
                <p>Ensure your contact information is up to date.</p>
            </div>

            <div class="profile-header">
                <div>
                    <img id="profilePreview" class="profile-avatar-large" src="https://ui-avatars.com/api/?name=User&background=1a56db&color=fff&size=200" alt="Avatar">
                </div>
                <div>
                    <h3 style="font-size: 1.1rem; font-weight: 600; margin-bottom: 3px;" id="displayName">Active User</h3>
                    <p style="color: #6b7280; font-size: 0.85rem; margin-bottom: 12px;">Update your avatar (Max 2MB).</p>
                    <div class="avatar-actions">
                        <input type="file" id="profileInput" hidden accept="image/*">
                        <button class="btn-sm btn-outline" onclick="document.getElementById('profileInput').click()">Upload</button>
                    </div>
                </div>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" class="form-control" placeholder="Update your name">
                </div>
                <div class="form-group">
                    <label>Registration / Roll No.</label>
                    <input type="text" class="form-control" placeholder="e.g. 21BCE0000">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" class="form-control" placeholder="university@example.edu">
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" class="form-control" placeholder="+1 (000) 000-0000">
                </div>
                <div class="form-group full-width">
                    <label>Department</label>
                    <select class="form-control">
                        <option value="" disabled selected>Select Department</option>
                        <option>Computer Science & Engineering</option>
                        <option>Information Technology</option>
                        <option>Electronics & Communication</option>
                        <option>Mechanical Engineering</option>
                        <option>Civil / Architecture</option>
                        <option>MBA / Business Admin</option>
                    </select>
                </div>
            </div>

            <div class="form-actions">
                <button class="btn-sm btn-outline" onclick="goBack()">Discard Changes</button>
                <button class="btn-primary" onclick="saveSettings(this)">Save Settings</button>
            </div>
        </div>
    </div>
</div>

<script>
// Authentication & UI Builder
const token = localStorage.getItem('cems_token');
if (!token) window.location.href = 'login.html';

const role = JSON.parse(atob(token.split('.')[1])).role;

function logout() {
    if(confirm("Securely sign out?")) {
        localStorage.removeItem('cems_token');
        window.location.href = "landing.html";
    }
}

// Dynamically generate the correct sidebar matching their role (Admin vs Student)
function renderSidebar() {
    const container = document.getElementById('sidebarContainer');
    
    if (role === 'admin') {
        container.innerHTML = `
        <aside class="sidebar">
          <div class="sidebar-logo">
            <h2><a href="landing.html" style="color:#1a56db;text-decoration:none;">🎓 EduEvents</a></h2>
            <p>Admin Control Panel</p>
          </div>
          <nav>
            <div class="nav-section">Main Menu</div>
            <a href="admin_dashboard.html" class="nav-link"><span class="icon">🏠</span> Dashboard</a>
            <a href="features/attendance/attendance.html" class="nav-link"><span class="icon">📊</span> Attendance</a>
            <a href="features/qr/scanner.html" class="nav-link"><span class="icon">📷</span> Scan Student QR</a>
            <a href="features/fraud/fraud-alerts.html" class="nav-link"><span class="icon">🛡️</span> Fraud Management</a>
            <a href="register-event.html" class="nav-link"><span class="icon">📋</span> Browse Events</a>
            <a href="college-events.html" class="nav-link"><span class="icon">📅</span> Events</a>
            <a href="admin_dashboard.html#registrationsSection" class="nav-link"><span class="icon">📋</span> Registrations</a>
            <div class="nav-section">Manage</div>
            <a href="events.html" class="nav-link"><span class="icon">🏛️</span> Departments</a>
            <div class="nav-section">Account</div>
            <a href="settings.html" class="nav-link active"><span class="icon">⚙️</span> Settings</a>
            <a href="#" class="nav-link" onclick="logout()"><span class="icon">🚪</span> Logout</a>
          </nav>
          <div class="sidebar-footer">
            <div class="user-avatar">AD</div>
            <div>
              <div class="user-name">Admin</div>
              <div class="user-role">Coordinator</div>
            </div>
          </div>
        </aside>
        `;
        document.getElementById('roleTitle').innerText = "Admin Settings";
        document.getElementById('displayName').innerText = "Administrator Account";
    } else if (role === 'organizer') {
        document.body.classList.add('student-mode');
        document.getElementById('mainContentWrapper').classList.add('student-mode');
        document.getElementById('profilePreview').src = "https://ui-avatars.com/api/?name=Or&background=f59e0b&color=fff&size=200";
        container.innerHTML = `
        <aside class="sidebar student-mode">
          <div class="sidebar-logo student-mode">
            <h2><a href="landing.html" style="color:#f59e0b;text-decoration:none;">🎓 EduEvents</a></h2>
            <p>Organizer Portal</p>
          </div>
          <nav>
            <div class="nav-section">Menu</div>
            <a href="organizer_dashboard.html" class="nav-link"><span class="icon">🏠</span> Dashboard</a>
            <a href="features/attendance/attendance.html" class="nav-link"><span class="icon">📊</span> Attendance</a>
            <a href="features/qr/scanner.html" class="nav-link"><span class="icon">📷</span> Scan Student QR</a>
            <a href="register-event.html" class="nav-link"><span class="icon">📋</span> Browse Events</a>
            <div class="nav-section">Account</div>
            <a href="settings.html" class="nav-link active"><span class="icon">⚙️</span> Settings</a>
            <a href="#" class="nav-link" onclick="logout()"><span class="icon">🚪</span> Logout</a>
          </nav>
          <div class="sidebar-footer">
            <div class="user-avatar" style="background:#f59e0b">OR</div>
            <div>
              <div class="user-name">Organizer</div>
              <div class="user-role">Event Staff</div>
            </div>
          </div>
        </aside>
        `;
        document.getElementById('roleTitle').innerText = "Organizer Settings";
        document.getElementById('displayName').innerText = "Organizer Account";
    } else {
        document.body.classList.add('student-mode');
        document.getElementById('mainContentWrapper').classList.add('student-mode');
        document.getElementById('profilePreview').src = "https://ui-avatars.com/api/?name=St&background=10b981&color=fff&size=200";
        
        container.innerHTML = `
        <aside class="sidebar student-mode">
          <div class="sidebar-logo student-mode">
            <h2><a href="landing.html" style="color:#10b981;text-decoration:none;">🎓 EduEvents</a></h2>
            <p>Student Portal</p>
          </div>
          <nav class="student-mode">
            <div class="nav-section">My Portal</div>
            <a href="student_dashboard.html" class="nav-link"><span class="icon">🏠</span> Dashboard</a>
            <a href="register-event.html" class="nav-link"><span class="icon">📅</span> Browse Events</a>
            <a href="features/qr/passes.html" class="nav-link"><span class="icon">🎟️</span> My Event Passes</a>
            <div class="nav-section">Account</div>
            <a href="settings.html" class="nav-link active"><span class="icon">⚙️</span> Settings</a>
            <a href="#" class="nav-link" onclick="logout()"><span class="icon">🚪</span> Logout</a>
          </nav>
          <div class="sidebar-footer">
            <div class="user-avatar">ST</div>
            <div>
              <div class="user-name">Student</div>
              <div class="user-role">Enrolled</div>
            </div>
          </div>
        </aside>
        `;
        document.getElementById('roleTitle').innerText = "Student Settings";
        document.getElementById('displayName').innerText = "Student Account";
    }
}

function goBack() {
    if (role === 'admin') window.location.href = 'admin_dashboard.html';
    else if (role === 'organizer') window.location.href = 'organizer_dashboard.html';
    else window.location.href = 'student_dashboard.html';
}

document.addEventListener("DOMContentLoaded", renderSidebar);

// Profile Update Handlers
document.getElementById("profileInput").addEventListener("change", function(){
    const file = this.files[0];
    if(file){
        const reader = new FileReader();
        reader.onload = function(e) { document.getElementById("profilePreview").src = e.target.result; }
        reader.readAsDataURL(file);
    }
});

function saveSettings(btn) {
    const originalText = btn.innerText;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Saving';
    setTimeout(() => {
        btn.innerHTML = '<i class="fas fa-check"></i> Applied';
        const okColor = role === 'admin' ? '#10b981' : '#059669';
        btn.style.background = okColor;
        
        setTimeout(() => {
            btn.innerHTML = originalText;
            btn.style.background = ''; // reset to class css
        }, 1500);
    }, 600);
}
</script>
</body>
</html>
