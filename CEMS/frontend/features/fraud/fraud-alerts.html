<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fraud Management - CEMS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #f7f8fc; min-height: 100vh; padding: 24px; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { font-size: 1.5rem; margin-bottom: 8px; color: #1e293b; }
    .subtitle { color: #64748b; font-size: 0.9rem; margin-bottom: 24px; }
    .nav-links { margin-bottom: 24px; }
    .nav-links a { color: #1a56db; text-decoration: none; font-weight: 500; margin-right: 16px; }
    .nav-links a:hover { text-decoration: underline; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
    .card h3 { margin-bottom: 16px; font-size: 1rem; }
    .alert-item { padding: 14px; border: 1px solid #fef3c7; background: #fffbeb; border-radius: 8px; margin-bottom: 12px; }
    .alert-item strong { color: #b45309; }
    .empty { text-align: center; padding: 40px; color: #059669; background: #d1fae5; border-radius: 12px; }
    .badge { font-size: 0.75rem; padding: 2px 8px; border-radius: 10px; background: #fef3c7; color: #b45309; }
  </style>
</head>
<body>
<div class="container">
  <div class="nav-links">
    <a href="../../admin_dashboard.html">← Back to Dashboard</a>
    <a href="../attendance/attendance.html">📊 Attendance</a>
    <a href="../qr/scanner.html">📷 Scan Student QR</a>
  </div>
  <h1>🛡️ Fraud Management</h1>
  <p class="subtitle">Suspicious registration activity. Admin only.</p>
  <div id="fraudList"></div>
</div>

<script>
  const token = localStorage.getItem('cems_token');
  if (!token) { window.location.href = '../../login.html'; }

  let role = '';
  try { role = JSON.parse(atob(token.split('.')[1])).role; } catch (e) {}
  if (role !== 'admin') {
    window.location.href = '../../admin_dashboard.html';
  }

  async function loadFraud() {
    const container = document.getElementById('fraudList');
    try {
      const res = await fetch('/api/fraud/alerts', { headers: { 'Authorization': `Bearer ${token}` } });
      if (res.status !== 200) { container.innerHTML = '<div class="empty">No access or no alerts.</div>'; return; }
      const alerts = await res.json();
      if (!alerts || alerts.length === 0) {
        container.innerHTML = '<div class="empty">✅ No suspicious activity detected. All clear!</div>';
        return;
      }
      let html = '<div class="card"><h3>⚠️ Flagged Activity</h3>';
      alerts.forEach(a => {
        html += `<div class="alert-item">
          <strong>IP:</strong> ${a.ip} <span class="badge">${a.count} registrations in 1hr</span><br>
          ${a.emails && a.emails.length ? `<small>Emails: ${a.emails.slice(0, 5).join(', ')}${a.emails.length > 5 ? '...' : ''}</small>` : ''}
        </div>`;
      });
      html += '</div>';
      container.innerHTML = html;
    } catch (err) {
      container.innerHTML = '<div class="empty">Error loading fraud alerts.</div>';
    }
  }
  loadFraud();
</script>
</body>
</html>
