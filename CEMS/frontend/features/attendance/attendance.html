<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Management - CEMS</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: #f7f8fc; min-height: 100vh; padding: 24px; }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { font-size: 1.5rem; margin-bottom: 8px; color: #1e293b; }
    .subtitle { color: #64748b; font-size: 0.9rem; margin-bottom: 24px; }
    .nav-links { margin-bottom: 24px; display: flex; gap: 12px; flex-wrap: wrap; }
    .nav-links a { color: #1a56db; text-decoration: none; font-weight: 500; }
    .nav-links a:hover { text-decoration: underline; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 20px; margin-bottom: 16px; }
    .card h3 { margin-bottom: 16px; font-size: 1rem; }
    .stat-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 1px solid #f1f5f9; }
    .stat-row:last-child { border-bottom: none; }
    .event-name { font-weight: 600; }
    .stat-badge { padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
    .badge-green { background: #d1fae5; color: #059669; }
    .badge-blue { background: #e0f2fe; color: #0284c7; }
    .empty { text-align: center; padding: 40px; color: #64748b; }
    .btn-scan { display: inline-block; margin-top: 16px; padding: 10px 20px; background: #1a56db; color: #fff; border-radius: 8px; text-decoration: none; font-weight: 600; }
    .btn-scan:hover { background: #1649b8; }
  </style>
</head>
<body>
<div class="container">
  <div class="nav-links">
    <a href="../../admin_dashboard.html" id="backLink">← Back to Dashboard</a>
    <a href="../qr/scanner.html">📷 Scan Student QR</a>
  </div>
  <h1>📊 Attendance Management</h1>
  <p class="subtitle">View registration vs attendance for each event.</p>
  <div id="attendanceList"></div>
  <a href="../qr/scanner.html" class="btn-scan">📷 Scan Student QR</a>
</div>

<script>
  const token = localStorage.getItem('cems_token');
  if (!token) { window.location.href = '../../login.html'; }

  let role = 'student';
  try { role = JSON.parse(atob(token.split('.')[1])).role; } catch (e) {}
  if (role !== 'admin' && role !== 'organizer') {
    window.location.href = role === 'admin' ? '../../admin_dashboard.html' : '../../organizer_dashboard.html';
  }

  document.getElementById('backLink').href = role === 'admin' ? '../../admin_dashboard.html' : '../../organizer_dashboard.html';

  async function loadAttendance() {
    const container = document.getElementById('attendanceList');
    try {
      let events = [];
      if (role === 'admin') {
        const evRes = await fetch('/api/events', { headers: { 'Authorization': `Bearer ${token}` } });
        if (evRes.ok) events = await evRes.json();
      } else {
        const evRes = await fetch('/api/events/available', { headers: { 'Authorization': `Bearer ${token}` } });
        if (evRes.ok) events = await evRes.json();
      }
      if (!Array.isArray(events) || events.length === 0) {
        container.innerHTML = '<div class="empty">No events found.</div>';
        return;
      }
      let html = '';
      for (const ev of events) {
        let total = 0, attended = 0;
        const attRes = await fetch(`/api/events/${ev._id}/attendance`, { headers: { 'Authorization': `Bearer ${token}` } });
        if (attRes.ok) {
          const d = await attRes.json();
          total = d.total || 0;
          attended = d.attended || 0;
        }
        const pct = total ? Math.round((attended / total) * 100) : 0;
        html += `<div class="card">
          <h3>${ev.name}</h3>
          <div class="stat-row"><span class="event-name">Registered</span><span class="stat-badge badge-blue">${total}</span></div>
          <div class="stat-row"><span class="event-name">Attended</span><span class="stat-badge badge-green">${attended}</span></div>
          <div class="stat-row"><span class="event-name">Attendance Rate</span><span>${pct}%</span></div>
        </div>`;
      }
      container.innerHTML = html;
    } catch (err) {
      container.innerHTML = '<div class="empty">Error loading attendance. Try again.</div>';
    }
  }
  loadAttendance();
</script>
</body>
</html>
