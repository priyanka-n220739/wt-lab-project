<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <script>
        async function loginsuccess() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const roleElement = document.querySelector('input[name="role"]:checked');
            const role = roleElement ? roleElement.value : null;
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, loginType: role })
                });

                const data = await response.json();

                if (response.ok) {
                    alert("Login successful");
                    localStorage.setItem('cems_token', data.token);
                    window.location.href = "dash_board.html";
                } else {
                    alert("Login failed: " + data.message);
                }
            } catch (err) {
                alert("Server error. Please try again later.");
            }
        }
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: url("https://www.pixelstalk.net/wp-content/uploads/2016/10/Download-Blue-And-Pink-Images.jpg");
            background-size: cover;
        }

        .overlay {
            position: fixed;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
        }

        /* slide from left */

        .form-box {
            position: absolute;
            left: -500px;
            width: 360px;
            padding: 40px;
            border-radius: 15px;
            backdrop-filter: blur(12px);
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.4);
            animation: slideLeft 1s forwards;
            color: white;
        }

        @keyframes slideLeft {
            from {
                left: -500px;
            }

            to {
                left: 50%;
                transform: translateX(-50%);
            }
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .input-box {
            position: relative;
            margin: 20px 0;
        }

        .input-box input {
            width: 100%;
            padding: 12px;
            border: none;
            outline: none;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .input-box label {
            position: absolute;
            left: 10px;
            top: 12px;
            color: white;
            transition: 0.3s;
        }

        .input-box input:focus+label,
        .input-box input:valid+label {
            top: -10px;
            font-size: 12px;
            color: #f06292;
        }

        .input-box input:focus {
            box-shadow: 0 0 10px #f06292;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #f06292;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #d81b60;
            transform: scale(1.05);
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: white;
            text-decoration: none;
        }

        .radio-group {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
        }

        .radio-group label {
            color: white;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>

<body>

    <div class="overlay"></div>

    <div class="form-box">

        <h2>Login</h2>

        <form>

            <div class="radio-group">
                <label><input type="radio" name="role" value="student" checked> Student Login</label>
                <label><input type="radio" name="role" value="organiser"> Organiser Login</label>
                <label><input type="radio" name="role" value="admin"> Admin Login</label>
            </div>

            <div class="input-box">
                <input type="email" id="email" required>
                <label>Email</label>
            </div>

            <div class="input-box">
                <input type="password" id="password" required>
                <label>Password</label>
            </div>

            <button type="button" onclick="loginsuccess()">Login</button>

            <a href="landing.html" class="back">⬅ Back</a>

        </form>

    </div>

</body>

</html>
