<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register</title>

<script>
function toggleCollegeId() {
    const role = document.getElementById('role').value;
    const box = document.getElementById('collegeIdBox');
    if (role === 'admin') {
        box.style.display = 'none';
        document.getElementById('collegeId').removeAttribute('required');
    } else {
        box.style.display = 'block';
        document.getElementById('collegeId').setAttribute('required', 'required');
    }
}

async function registersuccess() {
    const role = document.getElementById('role').value;

    let bodyData = {
        role,
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
    };

    // only for student
    if (role === "student") {
        bodyData.collegeId = document.getElementById('collegeId').value;
    }

    const response = await fetch('/api/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(bodyData)
    });

    const data = await response.json();

    if (response.ok) {
        alert("Registration successful");
        window.location.href = "login.html";
    } else {
        alert("Registration failed: " + data.message);
    }
}
</script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:url("https://www.shutterstock.com/image-photo/blurred-background-vibrant-scene-showcasing-600nw-2577243207.jpg");
background-size:cover;
}

/* dark overlay */
.overlay{
position:fixed;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
}

/* glass form */
.form-box{
position:absolute;
right:-500px;
width:360px;
padding:40px;
border-radius:15px;
backdrop-filter:blur(12px);
background:rgba(255,255,255,0.15);
border:1px solid rgba(255,255,255,0.3);
box-shadow:0 0 30px rgba(0,0,0,0.4);
animation:slideRight 1s forwards;
color:white;
}

@keyframes slideRight{
from{
right:-500px;
}
to{
right:50%;
transform:translateX(50%);
}
}

h2{
text-align:center;
margin-bottom:25px;
}

/* input group */

.input-box{
position:relative;
margin:20px 0;
}

.input-box input{
width:100%;
padding:12px;
border:none;
outline:none;
border-radius:5px;
background:rgba(255,255,255,0.2);
color:white;
font-size:15px;
}

.input-box label{
position:absolute;
left:10px;
top:12px;
color:white;
pointer-events:none;
transition:0.3s;
}

/* floating label */

.input-box input:focus + label,
.input-box input:valid + label{
top:-10px;
font-size:12px;
color:#808000;
}

/* glow effect */

.input-box input:focus{
box-shadow:0 0 10px #808000;
}

/* button */

button{
width:100%;
padding:12px;
border:none;
border-radius:6px;
background:#808000;
color:black;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.05);
}

/* back button */

.back{
display:block;
text-align:center;
margin-top:15px;
color:white;
text-decoration:none;
}

.input-box select{
width:100%;
padding:12px;
border:none;
outline:none;
border-radius:5px;
background:rgba(255,255,255,0.2);
color:white;
font-size:15px;
}

.input-box select option {
  color: black;
}
</style>
</head>

<body>

<div class="overlay"></div>

<div class="form-box">

<h2>Register</h2>

<form onsubmit="event.preventDefault(); registersuccess();">

<div class="input-box" style="margin-top: 5px;">
<label style="position: static; display: block; font-size: 14px; margin-bottom: 5px; color: white;">Register As</label>
<select id="role" required onchange="toggleCollegeId()" style="width:100%; padding:12px; border:none; outline:none; border-radius:5px; background:rgba(255,255,255,0.2); color:white; font-size:15px;">
    <option value="" disabled selected>Select Role</option>
    <option value="student">Student</option>
    <option value="admin">Admin</option>
</select>
</div>

<div class="input-box" id="collegeIdBox">
<input type="text" id="collegeId" required>
<label>College ID</label>
</div>

<div class="input-box">
<input type="email" id="email" required>
<label>College Email</label>
</div>

<div class="input-box">
<input type="password" id="password" required>
<label>Password</label>
</div>

<button type="button" onclick="registersuccess()">Register</button>

<a href="landing.html" class="back">⬅ Back</a>

</form>

</div>

</body>
</html>
