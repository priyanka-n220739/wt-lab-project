<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Organizer Register</title>
<script>
async function registersuccess() {
    const name = document.getElementById('name').value;
    const phone = document.getElementById('phone').value;
    const department = document.getElementById('department').value;
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    try {
        const response = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ role: 'organizer', name, phone, department, email, password })
        });

        const data = await response.json();

        if (response.ok) {
            alert("Organizer Registration successful. Please login.");
            window.location.href = "organizer_login.html";
        } else {
            alert("Registration failed: " + data.message);
        }
    } catch (err) {
        alert("Server error. Please try again later.");
    }
}
</script>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:Arial; }
body { height:100vh; display:flex; justify-content:center; align-items:center; background:url("https://www.shutterstock.com/image-photo/blurred-background-vibrant-scene-showcasing-600nw-2577243207.jpg"); background-size:cover; }
.overlay { position:fixed; width:100%; height:100%; background:rgba(0,0,0,0.6); }
.form-box { position:absolute; width:400px; padding:40px; border-radius:15px; backdrop-filter:blur(12px); background:rgba(255,165,0,0.15); border:1px solid rgba(255,255,255,0.3); box-shadow:0 0 30px rgba(0,0,0,0.4); color:white; z-index: 10; }
h2 { text-align:center; margin-bottom:25px; color: orange; }
.input-box { position:relative; margin:20px 0; }
.input-box input { width:100%; padding:12px; border:none; outline:none; border-radius:5px; background:rgba(255,255,255,0.2); color:white; }
.input-box label { position:absolute; left:10px; top:12px; color:white; transition:0.3s; }
.input-box input:focus + label, .input-box input:valid + label { top:-10px; font-size:12px; color:orange; }
.input-box input:focus { box-shadow:0 0 10px orange; }
button { width:100%; padding:12px; border:none; border-radius:6px; background:orange; color:white; font-weight:bold; cursor:pointer; transition:0.3s; }
button:hover { transform:scale(1.05); }
.back { display:block; text-align:center; margin-top:15px; color:white; text-decoration:none; }
</style>
</head>
<body>
<div class="overlay"></div>
<div class="form-box">
  <h2>Organizer Registration</h2>
  <form>
    <div class="input-box">
      <input type="text" id="name" required>
      <label>Full Name</label>
    </div>
    <div class="input-box">
      <input type="text" id="phone" required>
      <label>Phone Number</label>
    </div>
    <div class="input-box">
      <input type="text" id="department" required>
      <label>Department</label>
    </div>
    <div class="input-box">
      <input type="email" id="email" required>
      <label>Email</label>
    </div>
    <div class="input-box">
      <input type="password" id="password" required>
      <label>Password</label>
    </div>
    <button type="button" onclick="registersuccess()">Register</button>
    <a href="organizer_login.html" class="back">⬅ Back to Login</a>
  </form>
</div>
</body>
</html>
