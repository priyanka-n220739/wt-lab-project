<!DOCTYPE html>
<html>
<head>
<title>Register Event</title>
<!-- Font Awesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
/* Navbar */
.navbar { display:flex; justify-content:space-between; align-items:center; padding:15px 40px; background:#007BFF; color:white; font-family: sans-serif; }
.logo { font-size:22px; font-weight:bold; }
.nav-links { list-style:none; display:flex; gap:25px; margin: 0; padding: 0; }
.nav-links a { color:white; text-decoration:none; font-size:16px; }
.nav-links a:hover { text-decoration:underline; }

/* Heading */
.heading { text-align:center; margin-top:40px; margin-bottom:10px; font-family: sans-serif; }
.heading h1 { font-size:40px; font-weight:bold; background: linear-gradient(90deg,#007BFF,#00C6FF); -webkit-background-clip:text; color:transparent; margin: 0; }
.heading p { color: #666; font-size: 16px; margin-top: 10px; }

/* Events Grid */
.events-container { max-width: 1000px; margin: 40px auto; padding: 0 20px; font-family: sans-serif; }
.events-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; }

/* Classic Professional Event Card */
.event-card {
    background: white;
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    border: 1px solid #eef0f5;
    display: flex;
    flex-direction: column;
}
.event-card:hover {
    transform: translateY(-5px);
    box-shadow: 0 12px 25px rgba(0,0,0,0.1);
}
.event-card-header { padding-bottom: 15px; margin-bottom: 15px; border-bottom: 1px solid #f0f0f0; }
.event-title { font-size: 1.3rem; font-weight: bold; color: #2d3a4a; margin-top: 10px; margin-bottom: 0;}
.event-badge { display: inline-block; padding: 5px 12px; background: #eef2ff; color: #1a56db; font-size: 0.75rem; border-radius: 20px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; }
.event-details { margin-bottom: 20px; flex-grow: 1; }
.detail-item { display: flex; align-items: center; margin-bottom: 12px; color: #6b7a90; font-size: 0.9rem; }
.detail-item i { width: 25px; color: #007BFF; font-size: 1.1rem; }
.countdown { margin: 12px 0; padding: 10px; background: linear-gradient(135deg, #eef2ff, #e0f2fe); border-radius: 8px; font-size: 0.85rem; font-weight: 600; color: #1e40af; text-align: center; }
.countdown.ended { background: #f1f5f9; color: #64748b; }
.btn-register-card { width: 100%; padding: 12px; background: #007BFF; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; font-family: inherit;}
.btn-register-card:hover { background: #0056b3; }

/* Modal Styles */
.modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 100;
    align-items: center; justify-content: center; font-family: sans-serif; backdrop-filter: blur(4px);
}
.modal-overlay.open { display: flex; }
.modal-content {
    background: white; padding: 30px; border-radius: 12px; width: 420px; max-width: 90vw;
    box-shadow: 0 15px 35px rgba(0,0,0,0.2); animation: fadeInUp 0.3s ease;
}
@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}
.modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
.modal-title { font-size: 1.3rem; font-weight: bold; color: #2d3a4a; }
.close-btn { background: none; border: none; font-size: 1.4rem; cursor: pointer; color: #9aa3b2; transition: 0.2s;}
.close-btn:hover { color: #dc2626; }

/* Form inside modal */
.form-group { margin-bottom: 15px; }
.form-group label { display: block; font-weight: 600; margin-bottom: 6px; color: #444; font-size: 0.85rem;}
.form-group input, .form-group select { width: 100%; padding: 10px 12px; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; font-family: inherit; font-size: 0.95rem; outline:none; transition: border 0.2s;}
.form-group input:focus, .form-group select:focus { border-color: #007BFF; }
.btn-submit { width: 100%; background: #10b981; color: white; padding: 12px; border: none; border-radius: 6px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 10px; transition: background 0.2s; font-family: inherit;}
.btn-submit:hover { background: #059669; }

.success { display:none; text-align:center; background:#d1fae5; color:#065f46; padding:15px; border-radius:6px; margin-top:20px; font-weight:600; font-size: 0.95rem; border: 1px solid #10b981; }
</style>
</head>
<body style="background:#f4f7fb; margin:0;">

<nav class="navbar">
<div class="logo"><a href="landing.html" style="color:white;text-decoration:none;"><i class="fas fa-user-graduate"></i> EduEvents</a></div>
<ul class="nav-links">
<li><a href="landing.html"><i class="fas fa-home"></i> Home</a></li>
<li><a href="register-event.html"><i class="fas fa-calendar-alt"></i> Browse Events</a></li>
<li><a href="#" id="navDashboard"><i class="fas fa-th-large"></i> Dashboard</a></li>
<li><a href="about.html"><i class="fas fa-info-circle"></i> About</a></li>
<li><a href="login.html" id="navLogin">Login</a></li>
</ul>
</nav>

<div class="heading">
<h1>Discover Events</h1>
<p>Browse perfectly curated events waiting for your active participation</p>
</div>

<div class="events-container">
    <div class="events-grid" id="eventsGrid">
        <!-- Event Cards Injected Here -->
    </div>
</div>

<!-- Registration Modal -->
<div class="modal-overlay" id="registrationModal">
    <div class="modal-content">
        <div class="modal-header">
            <div class="modal-title" id="modalEventTitle">Register for Event</div>
            <button class="close-btn" onclick="closeModal()"><i class="fas fa-times"></i></button>
        </div>
        
        <form id="eventForm">
            <input type="hidden" id="eventTargetName">
            <input type="hidden" id="eventTargetId">
            
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="name" placeholder="John Doe" required>
            </div>
            <div class="form-group">
                <label>College Email</label>
                <input type="email" id="email" placeholder="john@example.edu" required>
            </div>
            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" id="phone" placeholder="+1 234 567 8900" required>
            </div>
            <div class="form-group">
                <label>Department</label>
                <select id="department" required>
                    <option value="" disabled selected>Select Department</option>
                    <option>CSE</option>
                    <option>ECE</option>
                    <option>Mechanical</option>
                    <option>Civil</option>
                    <option>IT</option>
                    <option>MBA</option>
                </select>
            </div>

            <button class="btn-submit" type="submit"><i class="fas fa-check-circle"></i> Complete Registration</button>
        </form>
        
        <div class="success" id="successMsg">✅ Registration Successful! <a href="features/qr/passes.html" style="color:#065f46;text-decoration:underline;">View My Event Pass →</a></div>
    </div>
</div>

<script>
const token = localStorage.getItem("cems_token");
if (!token) {
    alert("Please log in to register for events.");
    window.location.href = "login.html";
}

document.addEventListener("DOMContentLoaded", async () => {
  const token = localStorage.getItem("cems_token");
  const navDashboard = document.getElementById("navDashboard");
  const navLogin = document.getElementById("navLogin");
  if (token) {
    try {
      const role = JSON.parse(atob(token.split(".")[1])).role;
      navDashboard.href = role === "admin" ? "admin_dashboard.html" : (role === "organizer" ? "organizer_dashboard.html" : "student_dashboard.html");
      navDashboard.innerHTML = '<i class="fas fa-th-large"></i> Dashboard';
      navDashboard.style.display = "";
    } catch (e) {}
    navLogin.href = "#";
    navLogin.innerHTML = "Logout";
    navLogin.onclick = () => { localStorage.removeItem("cems_token"); window.location.href = "landing.html"; };
  } else {
    navDashboard.style.display = "none";
    navLogin.href = "login.html";
    navLogin.innerHTML = "Login";
  }

  try {
        if (!token) {
          document.getElementById("eventsGrid").innerHTML = '<div style="text-align:center;grid-column:1/-1;padding:40px;"><p style="color:#64748b;font-size:1.1rem;">Please log in to browse and register for events.</p><a href="login.html" style="display:inline-block;margin-top:16px;padding:12px 24px;background:#1a56db;color:white;border-radius:8px;text-decoration:none;">Login</a></div>';
          return;
        }
        const response = await fetch('/api/events/available', {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        const events = await response.json();
        const grid = document.getElementById("eventsGrid");
        grid.innerHTML = "";

        if(events.length === 0) {
            grid.innerHTML = "<p style='text-align:center; grid-column: 1/-1; color:#9aa3b2; font-size: 1.1rem; margin-top: 40px;'>No events currently open for registration check back soon!</p>";
            return;
        }

        events.forEach(ev => {
            const dateStr = new Date(ev.date).toLocaleDateString('en-US', { day:'numeric', month:'long', year:'numeric' });
            const [h, m] = (ev.startTime || '09:00').split(':');
            const eventStart = new Date(ev.date);
            eventStart.setHours(parseInt(h,10), parseInt(m,10), 0, 0);
            const countdownId = 'countdown-' + ev._id;
            const card = document.createElement("div");
            card.className = "event-card";
            card.innerHTML = `
                <div class="event-card-header">
                    <div class="event-badge">${ev.department}</div>
                    <h3 class="event-title">${ev.name}</h3>
                </div>
                <div class="event-details">
                    <div class="detail-item"><i class="fas fa-calendar-check"></i> <span>${dateStr}</span></div>
                    <div class="detail-item"><i class="fas fa-map-marker-alt"></i> <span>${ev.place || ev.venue || 'Venue TBA'}</span></div>
                    <div class="detail-item"><i class="fas fa-users"></i> <span>Seats: ${ev.maxSeats || 'Unlimited'}</span></div>
                    <div class="countdown" id="${countdownId}">⏳ Calculating...</div>
                </div>
                <button class="btn-register-card" data-event-name="${ev.name.replace(/"/g, '&quot;')}" data-event-id="${ev._id}" onclick="openModal(this.dataset.eventName, this.dataset.eventId)">Register Now</button>
            `;
            grid.appendChild(card);
            updateCountdown(countdownId, eventStart);
        });
        setInterval(() => {
            events.forEach(ev => {
                const [h, m] = (ev.startTime || '09:00').split(':');
                const eventStart = new Date(ev.date);
                eventStart.setHours(parseInt(h,10), parseInt(m,10), 0, 0);
                updateCountdown('countdown-' + ev._id, eventStart);
            });
        }, 1000);

    } catch (err) {
        console.error("Failed to load events", err);
    }
});

function updateCountdown(id, eventStart) {
    const el = document.getElementById(id);
    if (!el) return;
    const now = new Date();
    const diff = eventStart - now;
    if (diff <= 0) {
        el.textContent = 'Event started / ended';
        el.classList.add('ended');
        return;
    }
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    if (d > 0) el.textContent = '⏳ Starts in: ' + d + 'd ' + h + 'h ' + m + 'm ' + s + 's';
    else el.textContent = '⏳ Starts in: ' + h + 'h ' + m + 'm ' + s + 's';
    el.classList.remove('ended');
}

function openModal(eventName, eventId) {
    document.getElementById("modalEventTitle").innerText = `Register for ${eventName}`;
    document.getElementById("eventTargetName").value = eventName;
    document.getElementById("eventTargetId").value = eventId || '';
    
    // Reset from potential previous attempts
    document.getElementById("successMsg").style.display = "none";
    document.getElementById("eventForm").style.display = "block";
    
    document.getElementById("registrationModal").classList.add("open");
}

function closeModal() {
    document.getElementById("registrationModal").classList.remove("open");
}

// Close over window if clicking outside modal content
window.onclick = function(event) {
    const modal = document.getElementById("registrationModal");
    if (event.target == modal) {
        closeModal();
    }
}

document.getElementById("eventForm").addEventListener("submit", async function(e){
    e.preventDefault();
    
    let name = document.getElementById("name").value;
    let email = document.getElementById("email").value;
    let phone = document.getElementById("phone").value;
    let department = document.getElementById("department").value;
    let event = document.getElementById("eventTargetName").value;
    let eventId = document.getElementById("eventTargetId").value || null;

    try {
        const response = await fetch('/api/events/register', {
            method: 'POST',
            headers: { 
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            },
            body: JSON.stringify({ name, email, phone, department, event, eventId })
        });

        const data = await response.json();

        if (response.ok) {
            document.getElementById("eventForm").style.display = "none";
            document.getElementById("successMsg").style.display = "block";
            document.getElementById("eventForm").reset();
            if (typeof showToast === 'function') showToast('Registration successful! Check My Event Passes for your QR.', 'success');
            setTimeout(() => closeModal(), 2500);
        } else {
            alert("Registration failed: " + data.message);
        }
    } catch (err) {
        alert("Server error. Please try again later.");
    }
});
</script>
<link rel="stylesheet" href="/features/notifications/toast.css">
<script src="/features/notifications/toast.js"></script>
<script src="/features/notifications/smart-notifications.js"></script>
</body>
</html>
